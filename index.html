<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Valerine ❤️</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffb6d5, #ffdff0, #ff9fc8);
    overflow-x: hidden;
    color: #5a1835;
}

.contenedor {
    width: 100%;
    max-width: 950px;
    margin: auto;
    padding: 30px 20px 80px;
    text-align: center;
    position: relative;
    z-index: 2;
}

/* TÍTULO */

.titulo {
    margin-top: 25px;
    font-size: clamp(35px, 8vw, 65px);
    color: #d4145a;
    font-weight: 900;
    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 5px 15px rgba(150,0,60,.25);
    animation: aparecer 2s ease;
}

.subtitulo {
    margin-top: 10px;
    font-size: 20px;
    font-weight: bold;
}

/* CORAZONES DECORATIVOS */

.corazon-decorativo {
    position: absolute;
    font-size: 35px;
    animation: latido 1.5s infinite;
}

.c1 { top: 40px; left: 5%; }
.c2 { top: 100px; right: 6%; animation-delay: .3s; }
.c3 { top: 250px; left: 2%; animation-delay: .7s; }
.c4 { top: 300px; right: 2%; animation-delay: 1s; }

/* GALERÍA */

.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    margin-top: 55px;
}

.tarjeta {
    background: rgba(255,255,255,.88);
    padding: 15px;
    border-radius: 25px;
    box-shadow: 0 12px 35px rgba(120,0,60,.2);

    opacity: 0;
    transform: translateY(50px) scale(.9);

    animation: aparecerTarjeta 1s forwards;

    position: relative;
}

.tarjeta:nth-child(1) { animation-delay: .5s; }
.tarjeta:nth-child(2) { animation-delay: 1s; }
.tarjeta:nth-child(3) { animation-delay: 1.5s; }
.tarjeta:nth-child(4) { animation-delay: 2s; }
.tarjeta:nth-child(5) { animation-delay: 2.5s; }
.tarjeta:nth-child(6) { animation-delay: 3s; }

.tarjeta:hover {
    transform: scale(1.04);
}

.tarjeta img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 18px;
}

.tarjeta h2 {
    margin-top: 12px;
    color: #d4145a;
}

/* CORAZÓN DE CADA TARJETA */

.tarjeta::after {
    content: "❤️";
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 28px;
    animation: latido 1.3s infinite;
}

/* MENSAJE FINAL */

.mensaje {
    margin: 70px auto 0;
    max-width: 750px;

    background: rgba(255,255,255,.95);

    padding: 45px 25px;

    border-radius: 35px;

    box-shadow:
        0 15px 50px rgba(130,0,60,.25),
        0 0 40px rgba(255,255,255,.8);

    opacity: 0;

    animation: mensajeFinal 2s ease 4.5s forwards;
}

.mensaje h2 {
    color: #d4145a;
    font-size: 30px;
    margin-bottom: 20px;
}

.mensaje p {
    font-size: clamp(22px, 5vw, 30px);
    line-height: 1.5;
    font-weight: bold;
}

.corazon-grande {
    font-size: 60px;
    margin-top: 20px;
    animation: latido 1s infinite;
}

/* CORAZONES FLOTANTES */

.corazon-flotante {
    position: fixed;
    bottom: -50px;
    z-index: 1;
    pointer-events: none;

    animation: flotar linear forwards;
}

/* ANIMACIONES */

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes aparecerTarjeta {
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes mensajeFinal {
    from {
        opacity: 0;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes latido {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }
}

@keyframes flotar {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform: translateY(-120vh) rotate(360deg);
        opacity: 0;
    }
}

</style>
</head>


<body>

<div class="contenedor">

    <!-- CORAZONES DECORATIVOS -->

    <div class="corazon-decorativo c1">❤️</div>
    <div class="corazon-decorativo c2">💗</div>
    <div class="corazon-decorativo c3">💕</div>
    <div class="corazon-decorativo c4">💖</div>


    <h1 class="titulo">
        VALERINE FORZONE ❤️
    </h1>

    <p class="subtitulo">
        Algunas de las cosas que te gustan mucho... 💕
    </p>


    <div class="galeria">

        <div class="tarjeta">
            <img src="Patoluca.jpg">
            <h2>Tenga un pato lucas 🦆</h2>
        </div>


        <div class="tarjeta">
            <img src="Patitofeo.jpg">
            <h2>El Patito Feo 🐥</h2>
        </div>


        <div class="tarjeta">
            <img src="Omarcourtz.jpg">
            <h2>Omar COURTZ 🎶</h2>
        </div>


        <div class="tarjeta">
            <img src="Soyluna.jpg">
            <h2>Soy Luna 🌙</h2>
        </div>


        <div class="tarjeta">
            <img src="Cenicienta3.jpg">
            <h2>La Cenicienta 3 👑</h2>
        </div>


        <div class="tarjeta">
            <img src="Haaland.jpg">
            <h2>Haaland ⚽</h2>
        </div>

    </div>


    <!-- MENSAJE -->

    <div class="mensaje">

        <h2>Y ahora sí... ❤️</h2>

        <p>
            Así como a ti te gusta mucho todo esto,
            a mí me gusta mucho que estés en mi vida. ❤️
        </p>

        <div class="corazon-grande">
            ❤️
        </div>

    </div>

</div>


<script>

/* LLUVIA DE CORAZONES ❤️ */

const corazones = [
    "❤️",
    "💕",
    "💗",
    "💖",
    "💘",
    "💝",
    "💓"
];

function crearCorazon() {

    const corazon = document.createElement("div");

    corazon.classList.add("corazon-flotante");

    corazon.innerText =
        corazones[Math.floor(Math.random() * corazones.length)];

    corazon.style.left =
        Math.random() * 100 + "vw";

    corazon.style.fontSize =
        (18 + Math.random() * 30) + "px";

    corazon.style.animationDuration =
        (4 + Math.random() * 5) + "s";

    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 9000);
}


/* MUCHOS CORAZONES */

setInterval(crearCorazon, 300);


/* AL FINAL: LLUVIA MÁS INTENSA ❤️❤️❤️ */

setTimeout(() => {

    for (let i = 0; i < 60; i++) {

        setTimeout(() => {
            crearCorazon();
        }, i * 80);

    }

}, 4500);

</script>

</body>
</html>
